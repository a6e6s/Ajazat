<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none" class="w-full h-auto">
  <defs>
    <linearGradient id="ajazatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g filter="url(#shadow)">
    <!-- Main Outer Calendar/Badge Shape -->
    <rect x="10" y="10" width="80" height="80" rx="22" fill="url(#ajazatGrad)" />
    
    <!-- Top Calendar Header Bar -->
    <rect x="25" y="24" width="50" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.9" />
    
    <!-- Calendar Ring Hooks -->
    <rect x="32" y="18" width="6" height="12" rx="3" fill="#FFFFFF" />
    <rect x="62" y="18" width="6" height="12" rx="3" fill="#FFFFFF" />
    
    <!-- Checkmark / Palm Leaf Motif inside -->
    <path d="M34 54 L44 64 L66 42" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="66" cy="42" r="3.5" fill="#10B981" />
  </g>

  <!-- Typography Text -->
  <g transform="translate(108, 0)">
    <!-- Arabic Text -->
    <text x="0" y="52" font-family="'Cairo', 'Tajawal', system-ui, sans-serif" font-weight="800" font-size="36" fill="#1E293B" letter-spacing="-0.5">إجـــازات</text>
    
    <!-- English Subtitle -->
    <text x="2" y="74" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="3">AJAZAT PLATFORM</text>

    <!-- Decorative Accent Dot -->
    <circle cx="152" cy="44" r="5" fill="url(#ajazatGrad)" />
  </g>
</svg>
